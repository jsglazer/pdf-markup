<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: native pinch-zoom is disabled; ZoomController owns zoom (D3). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!-- Offline-only: every source is the app's own origin (pdfmarkup://app). No http(s) source is allowed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'"
    />
    <title>PDF Markup</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/boot.ts"></script>
  </body>
</html>
