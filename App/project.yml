# XcodeGen spec (D10). Generate with:  cd App && xcodegen generate
name: PDFMarkup
options:
  bundleIdPrefix: com.jsglazer
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: 1.0.4
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.jsglazer.pdf-markup
    PRODUCT_NAME: PDF Markup
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  PDFMarkupCore:
    path: ..
targets:
  PDFMarkup-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PDFMarkupCore
    preBuildScripts:
      - name: Build and embed web core
        script: '"$SRCROOT/../scripts/embed-web.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: PDF Markup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  PDFMarkup-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: PDFMarkupCore
    preBuildScripts:
      - name: Build and embed web core
        script: '"$SRCROOT/../scripts/embed-web.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Generated/PDFMarkup-macOS.entitlements
      properties:
        # network.client is required for WKWebView in a sandboxed app: without it WebKit's helper
        # processes cannot start and the page stays blank, even though every byte is served locally by
        # the pdfmarkup:// scheme handler. Offline is enforced by the page CSP ('self' only), the
        # WKContentRuleList that blocks all http(s) loads, and the pdfmarkup-only navigation policy.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: PDF Markup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
